<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student-Athlete Physical Activity Survey</title>
<meta name="description" content="Student-athletes' physical activity habits and the challenges they face on campus.">
<meta name="theme-color" content="#0e1b2c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e1b2c;--panel:#182a43;--line:#22364f;--orange:#ff6b2c;--cream:#f6f1e8;--mute:#a0b0c4}
*{box-sizing:border-box;margin:0}
html{background:var(--navy);color-scheme:dark}
body{background:var(--navy);color:var(--cream);font:400 16px/1.5 Inter,system-ui,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:clip}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:24px clamp(20px,5vw,72px) 12px}
header img{width:124px;display:block;margin-left:-4px}
.tag{font-weight:600;font-size:12px;letter-spacing:.26em;color:var(--orange)}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:clamp(24px,4vw,72px);align-items:center;width:100%;max-width:1320px;margin:auto;padding:12px clamp(20px,5vw,72px)}
#stage{width:100%;display:block;overflow:visible}
.lane{fill:none;stroke:var(--line);stroke-width:2}
.lane.hot{stroke:var(--orange);stroke-width:4;stroke-dasharray:90 1400;animation:lap 7s linear infinite}
@keyframes lap{to{stroke-dashoffset:-1490}}
h1,h2{font-family:Poppins,sans-serif;font-weight:700;line-height:1.14;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:clamp(35px,5.2vw,68px)}
h2{font-size:clamp(23px,2.7vw,36px)}
h1:focus,h2:focus{outline:none}
.rule{width:64px;height:5px;background:var(--orange);margin:20px 0;transform-origin:left;animation:grow .5s .15s both cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{transform:scaleX(0)}}
.lead{color:var(--mute);font-size:18px;max-width:44ch;margin-bottom:32px}
.big{font:700 clamp(17px,2vw,20px) Poppins,sans-serif;background:var(--orange);color:var(--navy);border:0;padding:18px 32px;cursor:pointer;transition:transform .2s,background .2s}
.big:hover{transform:translateY(-3px);background:#ff8350}.big:disabled{opacity:.6;cursor:wait;transform:none}
.opts{border:0;padding:0;display:grid;gap:10px}
.opts legend{padding:0;margin-bottom:22px}
.opt{display:flex;align-items:center;gap:18px;min-height:56px;padding:12px 20px;background:var(--panel);border-left:5px solid var(--orange);border-radius:0 10px 10px 0;cursor:pointer;font:600 17px/1.3 Poppins,sans-serif;position:relative;overflow:hidden;animation:in .45s both cubic-bezier(.2,.8,.2,1);animation-delay:calc(var(--i)*50ms + 80ms);transition:translate .2s}
.opt:hover{translate:6px 0}
.opt::before{content:"";position:absolute;inset:0;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.opt>*{position:relative}
.opt b{color:var(--orange);font-size:15px;min-width:22px;transition:color .2s}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.opt:has(:checked)::before{transform:none}
.opt:has(:checked),.opt:has(:checked) b{color:var(--navy)}
.opt:has(:focus-visible){outline:3px solid var(--cream);outline-offset:3px}
.tick{margin-left:auto;width:24px;height:24px;flex:none;fill:none;stroke:var(--navy);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .25s .12s}
.opt:has(:checked) .tick{stroke-dashoffset:0}
@keyframes in{from{opacity:0;transform:translateX(-28px)}}
#view.up>*{animation:up .4s both cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
textarea{width:100%;min-height:150px;background:var(--panel);border:0;border-left:5px solid var(--orange);border-radius:0 10px 10px 0;padding:18px 20px;font-size:17px;resize:vertical;margin-top:22px;display:block}
textarea::placeholder{color:var(--mute)}
footer{padding:12px clamp(20px,5vw,72px) 24px;width:100%;max-width:1320px;margin:0 auto}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.nav button{background:none;border:0;padding:12px 4px;font-weight:600;cursor:pointer;color:var(--mute)}
.nav button:hover{color:var(--cream)}
.nav #next{color:var(--orange)}
.nav span{color:var(--mute);font-weight:600;font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);position:relative;margin-bottom:8px}
.track i{position:absolute;inset:0;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.hide{visibility:hidden}
.err{color:#ffb08d;margin-top:16px}.err:empty{display:none}
.stamp{width:min(250px,56vw);display:block;margin-bottom:24px;animation:slam .55s .1s both cubic-bezier(.3,1.5,.5,1)}
@keyframes slam{from{opacity:0;transform:scale(2.4) rotate(-24deg)}}
.ringtext{transform-origin:150px 150px;animation:spin 30s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
a.big{display:inline-block;text-decoration:none}
@media(max-width:560px),(max-width:800px) and (orientation:portrait){
 header{padding-top:16px}header img{width:104px}.tag{font-size:10px}
 main{grid-template-columns:minmax(0,1fr);gap:8px;align-content:start;padding-top:0}
 .art{order:-1}#stage{height:min(24vh,200px)}
 body.home #stage{height:min(38vh,320px)}
 .opts legend{margin-bottom:14px}.opt{font-size:16px;min-height:52px;padding:10px 16px}
 .lead{font-size:17px;margin-bottom:24px}
 body.home footer,body.done footer{display:none}
}
footer{position:sticky;bottom:0;background:var(--navy);z-index:2;padding-bottom:max(10px,env(safe-area-inset-bottom))}
@media(max-width:560px) and (max-height:760px){
 header{padding:10px 20px 4px}#stage{height:17vh}body.home #stage{height:27vh}body.done #stage{height:15vh}
 h1{font-size:clamp(29px,9vw,33px)}h2{font-size:20px}.rule{margin:14px 0}.lead{font-size:16px;margin-bottom:18px}
 .opts{gap:8px}.opts legend{margin-bottom:10px}.opt{min-height:48px;padding:6px 14px;gap:12px;font-size:15px}
 .big{padding:14px 26px}textarea{min-height:96px;margin-top:14px;padding:14px 16px}.stamp{width:132px;margin-bottom:12px}
 .track{margin-bottom:0}footer{padding-top:8px}
}
@media(max-height:500px) and (min-width:561px){
 header{padding-top:10px;padding-bottom:2px}main{padding-top:0;align-items:start;gap:24px}
 .art{position:sticky;top:8px}#stage{height:62vh}
 h1{font-size:32px}h2{font-size:20px}.rule{margin:10px 0}.lead{font-size:15px;margin-bottom:14px}
 .opts{gap:8px}.opts legend{margin-bottom:10px}.opt{min-height:48px;padding:6px 16px;font-size:15px}
 .big{padding:12px 24px}textarea{min-height:70px;margin-top:10px;padding:12px 16px}.stamp{width:104px;margin-bottom:8px}
 .track{margin-bottom:0}footer{padding-top:6px;padding-bottom:0}body.home footer,body.done footer{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style></head>
